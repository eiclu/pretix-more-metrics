[pretix]
instance_name=pretix-more-metrics CI
url=http://localhost:8345
currency=EUR
datadir=/data
; nginx inside the standalone image sets X-Forwarded-For
trust_x_forwarded_for=on

[locale]
default=de
timezone=Europe/Vienna

[database]
backend=postgresql
name=pretix
user=pretix
password=pretix
host=postgres

[mail]
from=ci@example.org
host=mailpit
port=1025

[redis]
location=redis://redis/0
sessions=true

[celery]
backend=redis://redis/1
broker=redis://redis/2

[metrics]
enabled=true
user=metrics
passphrase=metrics-ci-secret

[more_metrics]
quota_cache_seconds=2
